[project]
name = "flashback-backend"
version = "0.1.0"
description = "FastAPI service for the Flashback movie recommender"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.116,<1",
    "implicit>=0.7.3,<0.8",
    "numpy>=2.0,<3",
    "pydantic-settings>=2.10,<3",
    "scipy>=1.14,<2",
]

[dependency-groups]
dev = [
    "anyio>=4,<4.15",
    "httpx2>=2.12.0",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[project]
name = "flashback-model"
version = "0.1.0"
description = "Training and evaluation pipeline for the Flashback movie recommender"
requires-python = ">=3.14,<3.15"
dependencies = [
    "implicit>=0.7.3,<0.8",
    "numpy>=2.0,<3",
    "polars>=1.0,<2",
    "scipy>=1.14,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
